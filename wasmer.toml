[dependencies]
"wasmer/static-web-server" = "^1"

# serve the Next.js static export
[fs]
"/public" = "out"
"/settings" = "settings"

[[command]]
name = "script"
module = "wasmer/static-web-server:webserver"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["--config-file", "/settings/config.toml"]
